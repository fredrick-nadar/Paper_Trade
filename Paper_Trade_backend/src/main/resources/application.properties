spring.application.name=paper-trade-backend
# Secrets come from the gitignored .env file (see .env.example) or real environment variables
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/paper_trade
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always
server.error.include-stacktrace=never

jwt.secret=${JWT_SECRET}
jwt.expiry-hours=48

finnhub.key=${FINNHUB_KEY}
