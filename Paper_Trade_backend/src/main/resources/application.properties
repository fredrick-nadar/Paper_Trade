spring.application.name=paper-trade-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/paper_trade
spring.datasource.username=papertrade
spring.datasource.password=papertrade

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always
server.error.include-stacktrace=never

# JWT: override JWT_SECRET with an env var (32+ chars) outside local demo use
jwt.secret=${JWT_SECRET:paper-trade-demo-secret-key-change-me-0123456789}
jwt.expiry-hours=48
