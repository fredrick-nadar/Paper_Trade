spring.application.name=paper-trade-backend
# Secrets come from the gitignored .env file or real environment variables.
# The Android app never receives these backend secrets.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/paper_trade}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always
server.error.include-stacktrace=never

jwt.secret=${JWT_SECRET}
jwt.expiry-hours=48

finnhub.key=${FINNHUB_KEY}



# Campaign delivery is configured in CleverTap/Firebase; this backend currently does not
# send push notifications.
