name: Keep Render backend awake

# Render's free tier sleeps after ~15 min of inactivity, so ping every 5 min (GitHub's minimum; runs often drift late).
# Requires a PUBLIC repo: private repos bill each run as >= 1 minute, and
# 24/7 pinging would exhaust the monthly Actions quota.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: |
          # A cold start can take ~1 min, so allow a long first attempt.
          curl --fail --silent --show-error --max-time 100 --retry 2 --retry-delay 5 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://paper-trade-mmhw.onrender.com/"
